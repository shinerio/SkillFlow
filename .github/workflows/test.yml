name: test

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  verify-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cmd/skillflow/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: cmd/skillflow/frontend
        run: npm ci

      - name: Build frontend
        working-directory: cmd/skillflow/frontend
        run: npm run build

      - name: Run Go tests
        run: go test ./core/... ./cmd/skillflow

      - name: Run frontend unit tests
        working-directory: cmd/skillflow/frontend
        run: npm run test:unit

  native-macos:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build native macOS client
        run: |
          xcodebuild -project native/macos/SkillFlow/SkillFlow.xcodeproj \
            -scheme SkillFlow \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test native macOS daemon client
        run: |
          xcodebuild -project native/macos/SkillFlow/SkillFlow.xcodeproj \
            -scheme SkillFlow \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test

  native-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show .NET SDK version
        run: dotnet --info

      - name: Build native Windows client
        run: |
          dotnet build native/windows/SkillFlow/SkillFlow.sln `
            -c Debug `
            -p:Platform=x64 `
            --nologo

      - name: Test native Windows daemon client
        run: |
          dotnet test native/windows/SkillFlow/SkillFlow.sln `
            -c Debug `
            -p:Platform=x64 `
            --no-build `
            --nologo
